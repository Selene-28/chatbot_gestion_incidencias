# Chatbot CTIC-FIIS UNAC — reverse proxy :80 (dev y prod detrás de TLS).
# El cuerpo (rutas y proxy) vive en _app.inc, compartido con el server :443
# de producción (tls.conf, desde tls.conf.example).

# Rate limiting básico por IP: 10 r/s con ráfagas de 20 (aplicado a /api/)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    include /etc/nginx/conf.d/_app.inc;
}
