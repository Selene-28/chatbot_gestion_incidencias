# Overlay para Docker daemon remoto (p. ej. Cloud Agent).
# No usa bind-mounts del host: el daemon no ve /workspace, así que esos
# volúmenes quedan vacíos (nginx sin conf, MySQL sin esquemas, Alembic 404).
#
# Uso:
#   docker compose -f docker-compose.cloud.yml up -d --build
#
# El código y los estáticos van horneados en las imágenes.

name: chatbot-ctic

services:
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: chatbot-ctic-nginx:local
    ports:
      - "80:80"
    depends_on:
      chatbot-api:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    restart: unless-stopped

  chatbot-api:
    build: ./services/chatbot-api
    env_file: .env
    environment:
      DB_URL: mysql+asyncmy://chatbot:${DB_CHATBOT_PASSWORD}@mysql:3306/chatbot_db
      TICKETS_API_BASE_URL: http://ticket-service:8001
      TICKETS_API_KEY: ${TICKETS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-4-8}
      LLM_MODEL_ROUTER: ${LLM_MODEL_ROUTER:-claude-haiku-4-5}
      CHROMA_DIR: /data/chroma
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ:-America/Lima}
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  ticket-service:
    build: ./services/ticket-service
    env_file: .env
    environment:
      DB_URL: mysql+asyncmy://tickets:${DB_TICKETS_PASSWORD}@mysql:3306/tickets_db
      TICKETS_API_KEY: ${TICKETS_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      UPLOADS_DIR: /data/uploads
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_TECNICO_PASSWORD: ${SEED_TECNICO_PASSWORD}
      TZ: ${TZ:-America/Lima}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  mysql:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: chatbot-ctic-mysql:local
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_CHATBOT_PASSWORD: ${DB_CHATBOT_PASSWORD}
      DB_TICKETS_PASSWORD: ${DB_TICKETS_PASSWORD}
      TZ: ${TZ:-America/Lima}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  chroma_data:
  uploads:
